# Self-host the media plane. The app is `npm run dev` (Cloudflare Worker + UI).
# Host networking is Linux-only. LiveKit, Redis, and MediaMTX bind 127.0.0.1
# (see infra/*.yaml) so the published devkey is not reachable on the LAN.
# On macOS/Windows see README ("Docker Desktop networking").

services:
  redis:
    image: redis:7.4-alpine
    network_mode: host
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--bind", "127.0.0.1", "--protected-mode", "no"]

  livekit:
    image: livekit/livekit-server:v1.13.11
    network_mode: host
    restart: unless-stopped
    depends_on:
      - redis
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./infra/livekit.yaml:/etc/livekit.yaml:ro

  egress:
    image: livekit/egress:v1.15.0
    network_mode: host
    restart: unless-stopped
    depends_on:
      - livekit
      - redis
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./infra/egress.yaml:/etc/egress.yaml:ro
      - ./data/recordings:/out
    shm_size: "1gb"

  mediamtx:
    image: bluenviron/mediamtx:1.21.4
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./infra/mediamtx.yml:/mediamtx.yml:ro
      - ./data/rtmp:/recordings
