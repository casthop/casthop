name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt
      - run: cargo fmt -p casthop-media -p casthop-post -- --check
      - run: cargo fmt --manifest-path crates/casthop-hot/Cargo.toml -- --check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - run: cargo test -p casthop-media -p casthop-post
      - run: cargo clippy -p casthop-media -p casthop-post --all-targets --no-deps -- -D warnings
      - run: cargo test --manifest-path crates/casthop-hot/Cargo.toml
      - run: cargo clippy --manifest-path crates/casthop-hot/Cargo.toml --all-targets --no-deps -- -D warnings
      - run: cargo clippy --manifest-path crates/casthop-hot/Cargo.toml --target wasm32-unknown-unknown --no-deps -- -D warnings

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun run check:wasm

  audit:
    runs-on: ubuntu-latest
    env:
      # cargo-audit needs rustc 1.88+ to parse the current advisory DB (CVSS 4).
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun audit --audit-level=high
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - run: bun install --frozen-lockfile
      - run: |
          cp .env.example .env
          cp .dev.vars.example .dev.vars
      - name: Start app
        run: bun run dev > /tmp/casthop-dev.log 2>&1 &
      - name: Wait for app
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:5173/internal/perf >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "timeout waiting for app"
          cat /tmp/casthop-dev.log || true
          exit 1
      - name: Compositor perf main vs worker
        env:
          CI: "true"
          PERF: "1"
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: bun run test:perf
      - if: failure()
        run: cat /tmp/casthop-dev.log || true

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # Vite + Wrangler/Miniflare spawn workerd through Node, not Bun.
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: bun install --frozen-lockfile
      - run: |
          cp .env.example .env
          cp .dev.vars.example .dev.vars
          mkdir -p data/recordings data/rtmp
          chmod 777 data/recordings
      - run: docker compose up -d
      - name: Start app
        run: bun run dev > /tmp/casthop-dev.log 2>&1 &
      - name: Wait for app and media plane
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:5173/api/health >/dev/null \
              && curl -s -o /dev/null --max-time 2 http://127.0.0.1:7880 \
              && curl -s -o /dev/null --max-time 2 http://127.0.0.1:9090; then
              exit 0
            fi
            sleep 2
          done
          echo "timeout waiting for app/livekit"
          cat /tmp/casthop-dev.log || true
          docker compose logs || true
          exit 1
      - name: Headless live to MediaMTX
        env:
          CI: "true"
          E2E: "1"
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: bun run test:e2e
      - if: failure()
        run: |
          cat /tmp/casthop-dev.log || true
          docker compose logs || true

  e2e-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # Vite + Wrangler/Miniflare spawn workerd through Node, not Bun.
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Chromium
        run: bunx --bun @e2e-dev/web install chromium --with-deps
      - run: |
          cp .env.example .env
          cp .dev.vars.example .dev.vars
          mkdir -p data/recordings data/rtmp
          chmod 777 data/recordings
      - run: docker compose up -d
      - name: Start app
        run: bun run dev > /tmp/casthop-dev.log 2>&1 &
      - name: Wait for app and media plane
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:5173/api/health >/dev/null \
              && curl -s -o /dev/null --max-time 2 http://127.0.0.1:7880 \
              && curl -s -o /dev/null --max-time 2 http://127.0.0.1:9090; then
              exit 0
            fi
            sleep 2
          done
          echo "timeout waiting for app/livekit"
          cat /tmp/casthop-dev.log || true
          docker compose logs || true
          exit 1
      - name: Studio UI flows
        env:
          CI: "true"
          E2E_TELEMETRY_DISABLED: "1"
        run: bun run test:e2e-ui
      - if: failure()
        run: |
          cat /tmp/casthop-dev.log || true
          docker compose logs || true
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-studio-results
          path: |
            .e2e/report.json
            .e2e/results
          if-no-files-found: ignore
          retention-days: 7

  e2e-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: site
      - run: bun run build
        working-directory: site
      - name: Preview site
        working-directory: site
        run: bun run preview --host 127.0.0.1 --port 4321 > /tmp/site-preview.log 2>&1 &
      - name: Wait for site
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4321/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "timeout waiting for site preview"
          cat /tmp/site-preview.log || true
          exit 1
      - name: Header overflow and CTA
        env:
          CI: "true"
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
          SITE_URL: http://127.0.0.1:4321
        run: bun run test:e2e-site
      - if: failure()
        run: cat /tmp/site-preview.log || true
