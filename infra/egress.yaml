# LiveKit Egress — room composite to RTMP + file.
# insecure: true is required for local ws:// (not for production wss).
# Keys match the loopback-only LiveKit config. Replace before any networked deploy.
api_key: devkey
api_secret: casthop_dev_secret_not_for_production_use_32b
ws_url: ws://127.0.0.1:7880
insecure: true
health_port: 9090
template_port: 7980
enable_chrome_sandbox: false
# GHA runners are 2 vCPU; the default room-composite cost is 3.0 and would refuse Go Live.
cpu_cost:
  max_cpu_utilization: 0.95
  room_composite_cpu_cost: 0.8
redis:
  address: 127.0.0.1:6379
logging:
  level: info
