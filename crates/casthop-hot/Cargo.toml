[workspace]

[package]
name = "casthop-hot"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "workers-rs bench Worker for Casthop hot /api CPU (JWT mint/verify). Not on the live path."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
# Pins keep workers-rs 0.7 on rustc 1.83 (icu 2 / tokio 1.54 want a newer compiler).
addr2line = "=0.24.2"
backtrace = "=0.3.74"
idna = "=1.0.3"
idna_adapter = "=1.1.0"
js-sys = "=0.3.82"
object = "=0.41.0"
tokio = { version = "=1.41.1", default-features = false }
url = "=2.5.2"
wasm-bindgen = "=0.2.105"
worker = "=0.7.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
