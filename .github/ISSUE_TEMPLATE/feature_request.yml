name: Feature request
description: A change that is not in the tree today.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing when you use Casthop today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you want it to do. Stay specific. Do not assume a roadmap item is already built.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Anything you already tried, or a smaller change that would help.
    validations:
      required: false
